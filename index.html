
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Espacial</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #303b86 0%, transparent 45%),
        linear-gradient(135deg, #090b1e, #17113b, #080916);
      overflow: hidden;
    }

    .estrelas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#9ca8ff 1px, transparent 1px);
      background-size: 70px 70px, 110px 110px;
      background-position: 0 0, 35px 45px;
      opacity: 0.35;
    }

    .tela-inicial {
      position: relative;
      width: 90%;
      max-width: 650px;
      padding: 50px 35px;
      text-align: center;
      border: 1px solid #7778ff;
      border-radius: 25px;
      background: rgba(15, 17, 48, 0.85);
      box-shadow: 0 0 45px #6755ff33;
      animation: aparecer 1s ease;
    }

    .icone {
      font-size: 65px;
      margin-bottom: 20px;
      animation: flutuar 3s ease-in-out infinite;
    }

    .tag {
      color: #9ba2ff;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0;
      font-size: clamp(30px, 6vw, 48px);
      background: linear-gradient(90deg, #ffffff, #a8a1ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      max-width: 470px;
      margin: 0 auto 30px;
      color: #c5c7e6;
      line-height: 1.8;
      font-size: 16px;
    }

    .iniciar-btn {
      padding: 16px 35px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #7667ff, #a24dff);
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 25px #765cff55;
    }

    .iniciar-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 8px 35px #765cff99;
    }

    .rodape {
      margin-top: 30px;
      color: #777ba8;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .tela-inicial {
        padding: 35px 22px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="estrelas"></div>

  <div class="tela-inicial">
    <div class="icone">🚀</div>

    <div class="tag">Uma aventura começa agora</div>

    <h1>Missão Espacial</h1>

    <p>
      O universo está em perigo! Uma misteriosa força ameaça
      destruir a galáxia. Você foi escolhido para investigar
      esse fenômeno, superar desafios e salvar a humanidade.
      Prepare-se, astronauta. O destino está em suas mãos!
    </p>

    <button class="iniciar-btn">INICIAR MISSÃO →</button>

    <div class="rodape">EXPLORAÇÃO • CORAGEM • DESCOBERTA</div>
  </div>

  <script>
    const botaoIniciar = document.querySelector(".iniciar-btn");
    const telaInicial = document.querySelector(".tela-inicial");

    function iniciaJogo() {
      telaInicial.innerHTML = `
        <div class="icone">🌌</div>
        <h1>Missão iniciada!</h1>
        <p>
          Astronauta, prepare-se para decolar!
          Sua jornada pelo universo começa agora.
          Boa sorte, comandante!
        </p>
      `;
    }

    botaoIniciar.addEventListener("click", iniciaJogo);
  </script>
</body>
</html>
